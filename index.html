<style>
:root{--bg:#000;--tx:#fff;--tx2:#8e8e93;--tx3:#c7c7cc;--gl:rgba(255,255,255,.07);--gb:rgba(255,255,255,.14);--f1:rgba(255,255,255,.10);--f2:rgba(255,255,255,.14);--sep:rgba(255,255,255,.12);--sheet:rgba(40,40,44,.94);--nav:rgba(26,26,30,.92);--pb:#fff;--pt:#000;--ac:#0a84ff;--rd:#ff453a;--g1:rgba(94,92,230,.55);--g2:rgba(10,132,255,.45);--blob:.3;--mu:var(--tx2);--panel:var(--gl);--line:var(--gb);--r:20px;--ease:cubic-bezier(.32,.72,0,1)}
html[data-theme=light]{--bg:#f2f2f7;--tx:#000;--tx2:#6c6c70;--tx3:#8e8e93;--gl:rgba(255,255,255,.62);--gb:rgba(0,0,0,.08);--f1:rgba(0,0,0,.06);--f2:rgba(0,0,0,.08);--sep:rgba(0,0,0,.10);--sheet:rgba(250,250,252,.96);--nav:rgba(255,255,255,.92);--pb:#000;--pt:#fff;--g1:rgba(94,92,230,.22);--g2:rgba(10,132,255,.18);--blob:.2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;margin:0;background:var(--bg);color-scheme:dark}html[data-theme=light]{color-scheme:light}
html::before,html::after{content:"";position:fixed;width:480px;height:480px;border-radius:50%;opacity:var(--blob);pointer-events:none;z-index:-1}
html::before{background:radial-gradient(circle,#5e5ce6 0,rgba(94,92,230,0) 68%);top:-180px;left:-170px}html::after{background:radial-gradient(circle,#0a84ff 0,rgba(10,132,255,0) 68%);bottom:-200px;right:-190px}
body{height:100%;margin:0 auto;max-width:480px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:transparent;color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
header,main,nav{position:relative;z-index:1}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--gl);border:1px solid var(--gb);border-radius:16px;min-height:46px;padding:0 16px;font-weight:600;cursor:pointer;touch-action:manipulation;transition:transform .2s var(--ease)}
button:active{transform:scale(.97)}
button.p{background:var(--pb);border-color:transparent;color:var(--pt);font-size:17px;border-radius:17px;min-height:52px}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.5}
textarea,input{width:100%;background:var(--gl);border:1px solid var(--gb);border-radius:20px;padding:14px 16px}
textarea::placeholder,input::placeholder{color:var(--tx2)}
header{display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 20px 6px;flex:none}
.logo{width:34px;height:34px;border-radius:24%;border:1px solid #3a3a3c;object-fit:cover;flex:none}
header b{font-size:17px;font-weight:700;letter-spacing:-.3px}
.chip{margin-left:auto;font-size:12px;font-weight:600;color:var(--tx2);background:var(--gl);border:1px solid var(--gb);border-radius:99px;padding:6px 10px;white-space:nowrap}
.tswitch{position:relative;width:66px;height:36px;min-height:36px;padding:0;border-radius:18px;flex:none}
.tknob{position:absolute;top:3px;left:35px;width:28px;height:28px;border-radius:50%;background:var(--pb);color:var(--pt);display:grid;place-items:center;transition:left .5s var(--ease)}
html[data-theme=light] .tknob{left:3px}
.tknob svg{width:16px;height:16px}.tknob .sun{display:none}html[data-theme=light] .tknob .sun{display:block}html[data-theme=light] .tknob .moon{display:none}
main{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}main::-webkit-scrollbar{display:none}
.wrap{max-width:none;margin:0}
h1{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.8px;margin:4px 0 6px;text-shadow:0 0 18px var(--g1)}
h2{font-size:22px;letter-spacing:-.4px;margin:0 0 8px}h3{font-size:16px;font-weight:600;margin:14px 0 6px}
.mu{color:var(--tx2)}.wrap>p.mu{font-size:15px;margin:0 0 18px}
nav.bar{position:fixed;z-index:20;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 28px));display:flex;padding:6px;border-radius:32px;background:var(--nav);border:1px solid var(--gb);box-shadow:0 6px 20px rgba(0,0,0,.3);overflow:hidden}
nav.bar .hl{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/var(--n,3));border-radius:26px;background:var(--f2);transform:translateX(calc(var(--i,0)*100%));transition:transform .6s var(--ease)}
nav.bar button{position:relative;flex:1;min-width:0;background:none;border:0;border-radius:26px;min-height:54px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--tx2)}
nav.bar button.on{color:var(--tx)}nav.bar button svg{width:22px;height:22px}
nav.bar button.on svg{animation:bounce .6s var(--ease)}
@keyframes bounce{0%{transform:scale(.8)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0}.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;border-radius:99px;min-height:40px;font-weight:500;font-size:14px;background:var(--f1)}
.card{background:var(--gl);border:1px solid var(--gb);border-radius:28px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.g{flex:1}
.steps div{padding:6px 0;color:var(--tx2)}.steps .on{color:var(--tx)}.steps .done{color:var(--tx)}
.bar2{height:4px;background:var(--f1);overflow:hidden;border-radius:2px;margin:14px 0}
.bar2 i{display:block;height:100%;width:35%;background:var(--tx);animation:s 1.1s ease-in-out infinite;will-change:transform}
@keyframes s{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
iframe{width:100%;height:100%;border:1px solid var(--gb);border-radius:20px;background:#fff}
.stage{height:100%;display:flex;flex-direction:column;gap:8px}.frame{flex:1;min-height:0;display:flex;justify-content:center}
.frame iframe{max-width:100%}
#code{height:55vh;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto;resize:none}
.err{color:var(--rd)}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 0 max(12px,env(safe-area-inset-bottom));animation:fade .4s ease}
.md{width:min(456px,calc(100% - 24px));background:var(--sheet);border:1px solid var(--gb);border-radius:28px;padding:22px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;animation:sheet .45s var(--ease)}
.md h2{margin:0}.md p{margin:0}
.md .av{width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto;border:2px solid var(--gb)}
@keyframes sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}}
.card,.step{contain:layout paint}
a.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:17px;background:var(--pb);color:var(--pt);font-weight:600;font-size:17px;text-decoration:none}
.chk{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--tx2);font-size:.9rem}.chk input{width:auto;min-height:0;margin:0;padding:0}
.toast{position:fixed;z-index:80;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:var(--sheet);border:1px solid var(--gb);font-size:14px;font-weight:600;animation:drop 1.6s var(--ease) both}
@keyframes drop{0%{transform:translate(-50%,-70px);opacity:0}15%,80%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-70px);opacity:0}}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;transition:opacity .6s var(--ease),transform .6s var(--ease)}
#splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
.sp-logo{position:relative;width:104px;height:104px;margin-bottom:10px}
.sp-logo img{position:relative;z-index:1;width:100%;height:100%;border-radius:24%;border:1px solid #3a3a3c;object-fit:cover}
.sp-logo i{position:absolute;inset:0;border-radius:24%;border:1px solid var(--tx3);opacity:0;animation:ring 2.2s ease-out infinite}.sp-logo i:nth-child(2){animation-delay:1.1s}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.9);opacity:0}}
#splash h1{font-size:46px;margin:6px 0 0}#splash h1 span{display:inline-block;opacity:0;transform:translateY(14px);animation:letter .5s var(--ease) forwards}
@keyframes letter{to{opacity:1;transform:none}}
#splash .go{margin-top:22px;min-width:240px}
main.enter .wrap>*{animation:up .4s var(--ease) both}
main.enter .wrap>*:nth-child(2){animation-delay:.06s}main.enter .wrap>*:nth-child(3){animation-delay:.12s}main.enter .wrap>*:nth-child(4){animation-delay:.18s}main.enter .wrap>*:nth-child(5){animation-delay:.24s}main.enter .wrap>*:nth-child(n+6){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.promptcard{padding:12px 14px 14px;margin:0 0 14px}
.promptcard textarea{background:transparent;border:0;padding:6px 4px;border-radius:0;min-height:130px;resize:none}
.promptcard textarea:focus-visible{outline:none}
.promptcard>div:first-of-type{padding-top:10px;border-top:1px solid var(--sep);margin-top:8px!important}
.promptcard .mu{font-size:13px}
.full{width:100%}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.duo button{min-height:48px;padding:0 10px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);margin:26px 0 0}
.chips{padding:10px 0 4px}
.tagline{text-align:center;font-size:13px;color:var(--tx2);margin:22px 0 0}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.acts button{min-height:42px;padding:0 6px;font-size:14px}
.edtop{display:flex;align-items:center;gap:10px}.ib{width:46px;padding:0;flex:none}
.edname{flex:1;min-width:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.sm{min-height:42px;padding:0 18px;font-size:15px}
.duo.tight{margin:8px 0}.duo.tight button{min-height:40px;font-size:14px}
</style>
</head>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAILY=5; // website generations allowed per user per day
const todayKey=()=>new Date().toLocaleDateString('en-CA');
const genUsed=()=>{try{const g=JSON.parse(localStorage.getItem('sf.gen')||'{}');return g.d===todayKey()?g.n:0}catch{return 0}};
const genLeft=()=>Math.max(0,DAILY-genUsed());
const genCount=()=>{try{localStorage.setItem('sf.gen',JSON.stringify({d:todayKey(),n:genUsed()+1}))}catch{}};
const load=()=>{try{return JSON.parse(localStorage.getItem('sf.p')||'[]')}catch{return[]}},save=()=>{try{localStorage.setItem('sf.p',JSON.stringify(P))}catch{alert('Storage is full. Delete a project.')}};
let useBackup=false,imgFiles=[],imgThumbs=[],imgMode='use',img=null,P=load(),cur=null,view='home',tab='preview',pi=0,dev='390px',compare=null,busy=null;
const CHIPS={'Business Website':'A professional business website for a local consulting firm with services, team, pricing and a contact form.','Portfolio':'A modern portfolio website for a video editor with showreel section, projects grid and contact.','Restaurant':'A modern restaurant website with menu, pricing, gallery, location and WhatsApp booking.','Salon':'A salon website with services, price list, booking section and opening hours.','Landing Page':'A landing page for a habit-tracking app with features, pricing and a signup form.','Gaming':'A gaming community website with news, events, leaderboard and a Discord join section.','Event':'A one-page event website for a tech meetup with schedule, speakers and registration.','Online Store':'An online store homepage for handmade candles with product grid, about and contact.'};
const fileOf=p=>p.slug==='/'||p.slug==='index'?'index.html':p.slug.replace(/^\/|\.html$/g,'')+'.html';
const allJs=s=>s.pages.map(p=>p.javascript).join('\n');
const allCss=s=>s.pages.map(p=>p.css).join('\n');
const useAssets=(s,t)=>(s.assets||[]).reduce((a,x)=>a.split('assets/'+x.name).join(x.data),t);
const doc=(s,p,preview)=>`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(s.name)} - ${esc(p.name)}</title>${preview?`<style>${useAssets(s,allCss(s))}</style>`:'<link rel="stylesheet" href="style.css">'}</head><body>${preview?useAssets(s,p.html):p.html}${preview?`<script>document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');if(/\\.html$/.test(h)||h==='/'){e.preventDefault();parent.postMessage({sf:h},'*')}});${(preview?useAssets(s,allJs(s)):p.javascript).replace(/<\/script/gi,'<\\/script')}<\/script>`:'<script src="script.js"><\/script>'}</body></html>`;
async function api(body){let r;window._dbg='';const hd={'Content-Type':'application/json'};try{r=await fetch((window.API_BASE||'')+'/api/gemini',{method:'POST',headers:hd,body:JSON.stringify(body)})}catch{window._dbg='network';throw'ai'}
const d=await r.json().catch(()=>({}));if(!r.ok){window._dbg=r.status+(d.status?'/'+d.status:'')+(d.error?' '+d.error:'')+(d.why?' '+d.why:'');console.error('API error',r.status,d);throw d.error==='limit'?'limit':d.error==='busy'?'busy':d.error==='fallback'?'fallback':'ai'}return d}
const issues=s=>{const i=[];if(!s.pages?.length)return['no pages'];s.pages.forEach(p=>{if(!p.html||p.html.length<40)i.push(p.name+': empty page');if(/<html|<body/i.test(p.html))i.push(p.name+': contains full document tags')});if(!/@media/.test(allCss(s)))i.push('no media queries');if(/(^|[^-\w])width:\s*\d{4,}px/.test(allCss(s)))i.push('fixed wide layout');return i};
const snap=(label)=>{cur.versions.push({label,t:Date.now(),pages:JSON.parse(JSON.stringify(cur.pages))});cur.versions=cur.versions.slice(-10)};
const merge=ch=>{ch.forEach(n=>{const i=cur.pages.findIndex(p=>p.slug===n.slug);i<0?cur.pages.push(n):cur.pages[i]=n})};
function setBusy(steps,i,msg){busy={steps,i,msg};render()}
const errBox=(e,retry)=>e==='fallback'?`<div class="card"><p class="err">Our high-quality AI is busy right now.</p><p class="mu" style="margin:0 0 10px">You can continue with the backup AI (a bit simpler, and it takes a few minutes), or try again later.</p>${window._dbg?`<p class="mu" style="font-size:.8rem;margin:0 0 10px;word-break:break-all">Code: ${esc(window._dbg)}</p>`:''}<div class="row"><button class="p" onclick="useBackup=true;generate()">Continue with backup AI</button><button onclick="lastErr=null;render()">Try again later</button></div></div>`:`<div class="card"><p class="err">${e==='daily'?`You have used all ${DAILY} website generations for today. Come back tomorrow.`:e==='limit'?"You've reached the current AI generation limit.":e==='busy'?'The AI model is busy right now. Try again in a minute.':'AI generation failed. Try again.'}</p>${window._dbg?`<p class="mu" style="font-size:.8rem">Code: ${esc(window._dbg)}</p>`:''}<div class="row"><button class="p" onclick="${retry}">Retry</button><button onclick="busy=null;render()">Edit prompt</button></div></div>`;
let lastErr=null;
async function generate(){const prompt=$('#pr').value.trim();if(prompt.length<3&&!img&&!imgFiles.length)return;if(genLeft()<=0){lastErr='daily';render();return}const bk=useBackup;useBackup=false;const S=['Planning','Generating','Validating','Finishing'];let assetsNew=[];if(imgFiles.length&&imgMode==='use'){try{for(const f of imgFiles)assetsNew.push(await fileToAsset(f,assetsNew))}catch(e){alert(e.message==='full'?'These images are too large together. Use fewer or smaller images.':'Could not read an image.');return}}
window._retry='generate()';lastErr=null;setBusy(S,0);
try{setBusy(S,1);let s=bk?await stagedBackup(prompt||'A modern professional website',assetsNew.map(a=>'assets/'+a.name)):await api({mode:'generate',prompt:prompt||(assetsNew.length?'Create a website that uses my uploaded images':'Recreate the attached design'),image:assetsNew.length?null:img,assets:assetsNew.length?assetsNew.map(a=>'assets/'+a.name):undefined,backup:bk||undefined});img=null;imgFiles=[];imgThumbs=[];if(assetsNew.length)s.assets=assetsNew.map(a=>'assets/'+a.name);setBusy(S,2);let is=issues(s),warn='';
if(is.length){try{if(bk)throw 0;const f=await api({mode:'edit',prompt:'Fix these issues without changing the design: '+is.join('; '),site:s,page:'/',backup:bk||undefined});merge2(s,f.pages);}catch{}is=issues(s);if(is.length)warn='Generated with warnings: '+is.join(', ')}
setBusy(S,3);cur={id:Date.now().toString(36),name:s.name||'Untitled',description:s.description,theme:s.theme,pages:s.pages,versions:[],updated:Date.now(),warn,assets:assetsNew};snap('Initial website');genCount();P.unshift(cur);save();busy=null;pi=0;view='editor';tab='preview';toast=s.via&&s.via!=='gemini'?'Made with the backup AI, so quality may be lower. You can try again later for a better result.':'';render()}
catch(e){lastErr=e;busy=null;render()}}
function merge2(s,ch){ch.forEach(n=>{const i=s.pages.findIndex(p=>p.slug===n.slug);i<0?s.pages.push(n):s.pages[i]=n})}
async function applyEdit(prompt,label,bk){const orig=prompt;if(!prompt&&!img&&!imgFiles.length)return;const S=['Understanding','Editing','Saving'];setBusy(S,1);
try{let ass=[];if(imgFiles.length&&imgMode==='use'){for(const f of imgFiles)ass.push(await fileToAsset(f,[...(cur.assets||[]),...ass]));prompt=(prompt||'Use my uploaded images')+' (Use my uploaded image'+(ass.length>1?'s':'')+' '+ass.map(a=>'assets/'+a.name).join(', ')+' as <img>; do not redraw or recreate them, and do not apply filters, grayscale or overlays to them.)'}const pg=cur.pages[pi],others=cur.pages.map(p=>({name:p.name,slug:p.slug}));
const adding=/\bpage\b/i.test(prompt);const site={name:cur.name,theme:cur.theme,pages:adding?cur.pages:[pg],pageList:others,assets:[...(cur.assets||[]),...ass].map(a=>'assets/'+a.name)};
const d=await api({mode:'edit',prompt:prompt||'Match the attached image',site,page:pg.slug,image:ass.length?null:img,backup:bk||undefined});if(ass.length){cur.assets=cur.assets||[];cur.assets.push(...ass)}img=null;imgFiles=[];imgThumbs=[];const before=JSON.parse(JSON.stringify(cur.pages));window._ed='';merge(d.pages||[]);snap(label||d.summary||prompt.slice(0,50));cur.updated=Date.now();cur.prev=before;save();busy=null;toast=(d.summary||'Updated')+(d.via&&d.via!=='gemini'?' (backup AI, lower quality)':'');render()}
catch(e){if(e==='fallback'){busy=null;render();if(confirm('Our high-quality AI is busy right now. Continue this edit with the faster, lower-quality AI?'))return applyEdit(orig,label,true);toast='Try again later.';render();return}busy=null;toast=e&&e.message==='full'?'Image storage for this project is full. Delete an image first.':e==='limit'?"You've reached the current AI generation limit.":e==='busy'?'The AI model is busy right now. Try again in a minute.':'AI edit failed. Try again.';render()}}
let toast='';
function steps(){const{steps:S,i}=busy;return`<div class="wrap"><h1>${S[i]}…</h1><div class="bar2"><i></i></div>${busy.msg?`<p class="mu" style="font-size:.9rem">${esc(busy.msg)}</p>`:''}<div class="steps">${S.map((s,k)=>`<div class="${k<i?'done':k==i?'on':''}">${k<i?'✓':'•'} ${s}</div>`).join('')}</div></div>`}
const keepText=()=>{if($('#pr'))window._pr=$('#pr').value;if($('#ed'))window._ed=$('#ed').value};
const setImgMode=m=>{keepText();imgMode=m;render()};
const imgBox=()=>`<div class="row" style="margin-top:8px"><button onclick="imgIn.click()">Add images</button><input type="file" id="imgIn" accept="image/png,image/jpeg,image/webp" multiple hidden onchange="pick([...this.files]);this.value=''">${imgFiles.length?`${imgThumbs.map(t=>`<img src="${t}" alt="Attached image" style="height:44px;border-radius:6px">`).join('')}<button onclick="img=null;imgFiles=[];imgThumbs=[];render()">Remove</button>`:'<span class="mu" style="font-size:.85rem">Optional: your photos, logo or a screenshot</span>'}</div>${imgFiles.length?`<div class="row" style="margin-top:6px"><button class="g" style="${imgMode==='use'?'border-color:var(--ac)':''}" onclick="setImgMode('use')">Put these in my website</button><button class="g" style="${imgMode==='ref'?'border-color:var(--ac)':''}" onclick="setImgMode('ref')">Only copy the design</button></div>${imgMode==='ref'&&imgFiles.length>1?'<p class="mu" style="font-size:.8rem;margin:4px 0">Only the first image is used for the design.</p>':''}`:''}`;
async function pick(fs){keepText();for(const f of fs){if(imgFiles.length>=6){alert('Up to 6 images at a time.');break}
if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>10e6){alert(f.name+': use PNG, JPG or WebP under 10 MB.');continue}
try{const b=await createImageBitmap(f),sc=m=>{const k=Math.min(1,m/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)};
if(!imgFiles.length)img={mime:'image/jpeg',data:sc(1024).split(',')[1]};imgThumbs.push(sc(96));imgFiles.push(f)}catch{alert('Could not read '+f.name)}}
render()}
function home(){return`<div class="wrap"><h1>${P.length?'Build a website with AI':'Build your first website'}</h1><p class="mu">${P.length?'Describe what you want. SitePilot will create the website for you.':'What do you want to build?'}</p>
<div class="card promptcard"><textarea id="pr" rows="5" placeholder="Describe your website..." maxlength="4000">${esc(window._pr||'')}</textarea>${imgBox()}</div>
<button class="p full" onclick="window._pr=$('#pr').value;generate()">Generate Website</button>
<div class="duo"><button onclick="importZip.click()">Import ZIP</button><button onclick="pg.idea=$('#pr').value||pg.idea;view='prompt';render()">Prompt helper</button></div><input type="file" id="importZip" accept=".zip" hidden onchange="imp(this.files[0])">
<div class="lbl">Quick ideas</div>
<div class="chips">${Object.keys(CHIPS).map(k=>`<button onclick="$('#pr').value=CHIPS['${k}'];window._pr=CHIPS['${k}']">${k}</button>`).join('')}</div>${lastErr?errBox(lastErr,'generate()'):''}

const openP=id=>{cur=P.find(p=>p.id===id);pi=0;view='editor';tab='preview';render()};
const ren=id=>{const p=P.find(x=>x.id===id),n=prompt('Project name',p.name);if(n){p.name=n.slice(0,60);save();render()}};
const dup=id=>{const p=JSON.parse(JSON.stringify(P.find(x=>x.id===id)));p.id=Date.now().toString(36);p.name+=' copy';delete p.pub;P.unshift(p);save();render()};
const del=id=>{if(confirm('Delete this project?')){P=P.filter(p=>p.id!==id);save();render()}};
function editor(){const pg=cur.pages[pi]||cur.pages[0];const T=['preview','pages','ai','images','code'];
let body='';

body=`<div class="stage">${cur.warn?`<div class="err" style="font-size:.85rem">${esc(cur.warn)} You can fix it in the Code tab.</div>`:''}<div class="row">${[['Mobile','390px'],['Tablet','768px'],['Desktop','100%']].map(([n,w])=>`<button style="${dev===w?'border-color:var(--ac)':''}" onclick="dev='${w}';render()">${n}</button>`).join('')}<button onclick="render()">Refresh</button><span class="mu g"></span>${compare?'<b class="mu">Showing: Before</b>':''}</div><div class="frame"><iframe title="Preview" sandbox="allow-scripts" style="width:${dev}" srcdoc="${esc(doc(s,p,true))}"></iframe></div></div>`}

${cur.prev?`<div class="row" style="margin-top:10px"><button onclick="compare=cur.prev;tab='preview';render()">Before</button><button onclick="compare=null;tab='preview';render()">After</button><button onclick="undo()">Undo</button></div>`:''}
<h3>Versions</h3>${cur.versions.slice().reverse().map((v,i)=>{const n=cur.versions.length-i-1;return`<div class="card row"><span class="g">Version ${n+1}<br><span class="mu" style="font-size:.85rem">${esc(v.label)}</span></span><button onclick="compare=cur.versions[${n}].pages;tab='preview';render()">Preview</button><button onclick="restore(${n})">Restore</button></div>`}).join('')}</div>`;

if(tab==='code')body=`<div class="wrap"><div class="row">${['html','css','javascript'].map(k=>`<button style="${(window._k||'html')===k?'border-color:var(--ac)':''}" onclick="window._k='${k}';render()">${k.toUpperCase()}</button>`).join('')}</div><textarea id="code" spellcheck="false" style="margin:8px 0">${esc(pg[window._k||'html'])}</textarea><div class="row"><button class="p" onclick="saveCode()">Save Changes</button><button onclick="navigator.clipboard.writeText($('#code').value)">Copy Code</button></div></div>`;

function saveCode(){const k=window._k||'html';snap('Manual code edit');cur.pages[pi][k]=$('#code').value;cur.updated=Date.now();cur.prev=null;save();tab='preview';toast='';render()}
function undo(){if(!cur.prev)return;cur.pages=cur.prev;cur.prev=null;compare=null;save();render()}
function restore(n){snap('Before restore');cur.pages=JSON.parse(JSON.stringify(cur.versions[n].pages));cur.updated=Date.now();save();tab='preview';compare=null;render()}

async function build(){const z=new JSZip();cur.pages.forEach(p=>z.file(fileOf(p),doc(cur,p,false)));z.file('style.css',allCss(cur));z.file('script.js',cur.pages.map(p=>p.javascript).join('\n'));z.folder('assets');(cur.assets||[]).forEach(a=>z.file('assets/'+a.name,a.data.split(',')[1],{base64:true}));return z}
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
async function publish(){if(!cur.pub&&!confirm('This puts your website on the public internet with a link anyone can open. Continue?'))return;
setBusy(['Preparing','Publishing','Going live'],1);
try{const files={};cur.pages.forEach(p=>files[fileOf(p)]=doc(cur,p,false));files['style.css']=allCss(cur);files['script.js']=cur.pages.map(p=>p.javascript).join('\n');
const r=await fetch((window.API_BASE||'')+'/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:cur.name,pub:cur.pub&&{name:cur.pub.name,key:cur.pub.key},files,assets:Object.fromEntries((cur.assets||[]).map(a=>[a.name,a.data.split(',')[1]]))})});
const d=await r.json().catch(()=>({}));if(!r.ok)throw d.error||'x';
cur.pub={name:d.name,key:d.key,url:d.url,domain:cur.pub&&cur.pub.domain};cur.updated=Date.now();save();busy=null;view='editor';tab='preview';toast='Your website is live.';render()}
catch(e){busy=null;view='editor';toast=e==='config'?'Publishing is not set up on the server yet.':e==='limit'?'Publish limit reached for today.':'Publishing failed. Try again.';render()}}
let showDom=false;
async function domCall(action,domain){const r=await fetch((window.API_BASE||'')+'/api/domain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,domain,pub:{name:cur.pub.name,key:cur.pub.key}})});const d=await r.json().catch(()=>({}));if(!r.ok)throw d;return d}
const domErr=e=>e&&e.error==='config'?'Publishing is not set up on the server yet.':e&&e.error==='taken'?'This domain is already used by another Vercel project. Remove it there first.':e&&e.error==='input'?'Enter a valid domain like www.example.com.':'Could not connect the domain. Try again.';
async function domAdd(){const v=($('#dm').value||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'');if(!v)return;try{const d=await domCall('add',v);cur.pub.domain=d;save();toast=d.ready?'Domain connected.':'Domain added. Add the DNS records below at your domain provider, then tap Check status.'}catch(e){toast=domErr(e)}render()}
async function domCheck(){try{const d=await domCall('check',cur.pub.domain.name);cur.pub.domain=d;save();toast=d.ready?'Your domain is live.':'Not ready yet. DNS changes can take a few minutes to a few hours.'}catch(e){toast=domErr(e)}render()}
async function domRemove(){if(!confirm('Disconnect this domain from your website?'))return;try{await domCall('remove',cur.pub.domain.name)}catch(e){}delete cur.pub.domain;save();render()}

async function fileToAsset(f,existing){const b=await createImageBitmap(f),k=Math.min(1,1200/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
let mime=f.type==='image/jpeg'?'image/jpeg':'image/webp',data=c.toDataURL(mime,.82);if(!data.startsWith('data:'+mime)){mime='image/png';data=c.toDataURL('image/png')}
const ext={'image/jpeg':'jpg','image/webp':'webp','image/png':'png'}[mime],base=f.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'image';let name=base+'.'+ext,n=2;while(existing.some(a=>a.name===name))name=base+'-'+(n++)+'.'+ext;
if(existing.reduce((s,a)=>s+a.data.length,0)+data.length>2.5e6)throw new Error('full');
return{name,data}}
async function addAssets(fs){cur.assets=cur.assets||[];
for(const f of [...fs]){
if(cur.assets.length>=12){alert('Up to 12 images per project.');break}
if(!/^image\/(png|jpeg|webp|gif)$/.test(f.type)||f.size>10e6){alert(f.name+': use PNG, JPG, WebP or GIF under 10 MB.');continue}
try{cur.assets.push(await fileToAsset(f,cur.assets))}catch(e){if(e.message==='full'){alert('Image storage for this project is full. Delete an image first.');break}alert('Could not read '+f.name)}}
cur.updated=Date.now();save();render()}
function delAsset(i){if(confirm('Delete this image? Pages that use it will show a broken image.')){cur.assets.splice(i,1);cur.updated=Date.now();save();render()}}

function expHtml(){const p=cur.pages[pi],s=cur;dl(new Blob([`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(s.name)}</title><style>${useAssets(s,allCss(s))}</style></head><body>${useAssets(s,p.html)}<script>${useAssets(s,allJs(s)).replace(/<\/script/gi,'<\\/script')}<\/script></body></html>`],{type:'text/html'}),fileOf(p))}
async function imp(f){if(!f||f.size>5e6)return alert('Choose a ZIP under 5 MB.');try{const z=await JSZip.loadAsync(f),files={};for(const n in z.files){if(z.files[n].dir||!/\.(html|css|js)$/i.test(n))continue;files[n.split('/').pop()]=await z.files[n].async('string')}
const hs=Object.keys(files).filter(n=>/\.html$/i.test(n));if(!hs.length)throw 0;const css=Object.keys(files).filter(n=>/\.css$/i.test(n)).map(n=>files[n]).join('\n'),js=Object.keys(files).filter(n=>/\.js$/i.test(n)).map(n=>files[n]).join('\n');
const pages=hs.map((n,i)=>{const h=files[n],b=(h.match(/<body[^>]*>([\s\S]*)<\/body>/i)||[0,h])[1].replace(/<script[\s\S]*?<\/script>/gi,'');const inl=(h.match(/<style[^>]*>([\s\S]*?)<\/style>/gi)||[]).join('').replace(/<\/?style[^>]*>/g,'');return{name:n.replace('.html',''),slug:n==='index.html'?'/':n.replace('.html',''),html:b,css:i?inl:css+inl,javascript:i?'':js}});
cur={id:Date.now().toString(36),name:f.name.replace(/\.zip$/i,''),description:'Imported',theme:{},pages,versions:[],updated:Date.now()};snap('Imported website');P.unshift(cur);save();pi=0;view='editor';tab='preview';toast='Imported successfully';render()}catch{alert('Could not read that ZIP. It needs at least one .html file.')}}

const promptView=()=>`<div class="wrap"><div class="row"><button onclick="view='home';render()" aria-label="Back">←</button><h1 class="g" style="font-size:1.4rem">Prompt helper</h1></div><p class="mu">Write your website idea in a few words, in any language. AI turns it into a detailed prompt you can use to build the website.</p><textarea id="pi" rows="3" maxlength="600" placeholder="e.g. a website for my gym in Delhi">${esc(pg.idea)}</textarea><div class="chips">${['Video editor portfolio','Restaurant with online ordering','Gym and fitness trainer','Handmade jewellery shop','Wedding photographer','Coaching classes'].map(x=>`<button onclick="pg.idea='${x}';render()">${x}</button>`).join('')}</div><button class="p" style="width:100%" ${pg.busy?'disabled':''} onclick="makePrompt()">${pg.busy?'Writing your prompt...':'Create detailed prompt'}</button>${pg.err?`<p class="err" role="alert">${esc(pg.err)}</p>`:''}${pg.out?`<div class="card"><b>Your prompt</b><p class="mu" style="margin:4px 0 8px;font-size:.85rem">You can edit it before using it.</p><textarea id="po" rows="12">${esc(pg.out)}</textarea><div class="row" style="margin-top:8px"><button class="p g" onclick="usePrompt()">Use this prompt</button><button onclick="copyPrompt()">Copy</button><button onclick="makePrompt()">Rewrite</button></div></div>`:''}</div>`;
async function makePrompt(){const e=$('#pi');if(e)pg.idea=e.value.trim();
if(pg.idea.length<3){pg.err='Write at least a few words about your idea.';render();return}
pg.busy=true;pg.err='';render();
try{const d=await api({mode:'prompt',prompt:pg.idea});pg.out=d.prompt||'';if(!pg.out)throw 'ai'}
catch(x){pg.err=x==='limit'?"You've reached today's limit for the prompt helper. Try again tomorrow.":x==='busy'?'The AI is busy right now. Try again in a minute.':'Could not create the prompt. Try again.'}
pg.busy=false;render()}
const usePrompt=()=>{const e=$('#po');window._pr=(e?e.value:pg.out).trim();view='home';render()};
const copyPrompt=()=>{const e=$('#po'),t=e?e.value:pg.out;navigator.clipboard.writeText(t).then(()=>showToast('Prompt copied'),()=>window.prompt('Copy this prompt',t))};
const classList=css=>[...new Set((css.match(/\.[a-zA-Z][\w-]*/g)||[]).map(x=>x.slice(1)))].slice(0,110);
async function stagedBackup(prompt,assetNames){ // backup AIs write the plan and the content in steps; the SitePilot Kit on the server supplies the polished design
const S=['Planning','Writing pages','Finishing'];let prog=0;
const stage=async body=>{for(let t=0;;t++){try{return await api({mode:'generate',prompt,assets:assetNames.length?assetNames:undefined,backup:true,...body})}catch(e){if(e==='limit'||t>=3)throw e;setBusy(S,prog,'The AI is rate-limited. Waiting a moment, then trying again...');await new Promise(r=>setTimeout(r,20000))}}};
setBusy(S,0,'The backup AIs build your site in steps. This can take a few minutes.');
const plan=await stage({stage:'plan'});
prog=1;setBusy(S,1,'Writing '+plan.pages.length+' page'+(plan.pages.length>1?'s':'')+' with several AIs working together...');
const brief={name:plan.name,tagline:plan.tagline,description:plan.description,preset:plan.preset,brandColor:plan.brandColor,contactEmail:plan.contactEmail,tone:plan.tone,navCta:plan.navCta,pages:plan.pages};
const pages=await Promise.all(plan.pages.map((p,i)=>stage({stage:'page',brief,pageIndex:i,slot:i}).then(r=>({name:p.name,slug:p.slug,html:r.html,css:'',javascript:r.javascript||''}))));
pages[0].css=plan.css;prog=2;setBusy(S,2,'Almost done...');
return{name:plan.name,description:plan.description,theme:plan.theme,pages,via:'backup'}}

function toggleTheme(e){const next=document.documentElement.dataset.theme==='light'?'dark':'light';
const b=e.currentTarget.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
